name: CI

# Runs on every pull request and on pushes to main. Pull request is the gate
# that matters: the branch protection rule requires these jobs to pass.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# A new push to a PR cancels the previous run. Without this, a branch pushed
# three times in a minute occupies three sets of runners producing two results
# nobody will read.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege. Jobs here only read the repository; nothing publishes.
permissions:
  contents: read

env:
  # The CI layer pins threads=2 and memory_limit=4GB to match a standard
  # runner's 2 vCPU / 7 GB, and forces JSON logging. Deriving thread count from
  # the runner's advertised CPU count would oversubscribe its cgroup quota.
  MARKETPULSE_ENV: ci
  PYTHONUNBUFFERED: "1"
  # Fail fast on a dependency resolution problem rather than hanging a runner.
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e . --group dev

      - name: Ruff check
        run: ruff check . --output-format=github

      - name: Ruff format
        run: ruff format --check --diff .

  types:
    name: Type check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e . --group dev

      - name: Mypy
        run: mypy

  test:
    name: Test ${{ matrix.os }} / py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      # Collect every failure. fail-fast would hide a Windows-only break behind
      # an unrelated Linux failure, which is the exact case this matrix exists
      # to catch.
      fail-fast: false
      matrix:
        # Windows is in the matrix because the platform is developed on Windows
        # and pathlib semantics, path separators, and line endings diverge
        # there. A Linux-only suite validates a configuration no contributor is
        # actually using.
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e . --group dev

      - name: Report engine versions
        # Recorded before the suite so that a failure caused by a new Polars or
        # DuckDB release is diagnosable from the log alone. filterwarnings is
        # set to "error", so an upstream deprecation fails the build here.
        run: marketpulse doctor

      - name: Pytest
        run: pytest -ra --junit-xml=junit.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: junit-${{ matrix.os }}-py${{ matrix.python-version }}
          path: junit.xml
          if-no-files-found: ignore

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e . --group dev

      - name: Pytest with coverage
        # The gate (fail_under = 90) is configured in pyproject.toml so that a
        # local run enforces the same threshold as CI.
        run: pytest --cov --cov-report=term-missing --cov-report=xml

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore

  architecture:
    name: Architecture conventions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e . --group dev

      - name: Enforce structural invariants
        # Asserts the claims the documentation makes: core imports nothing
        # internal, no module imports PySpark/Pandas/NumPy, library code does
        # not configure logging or print, every ADR has a reversal condition.
        # A separate job so a convention break is attributable at a glance.
        run: pytest -m architecture -ra

  build:
    name: Build wheel
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build
        # The wheel is installed on Databricks clusters, so a packaging error
        # must surface in CI rather than at deploy time.
        run: |
          pip install build
          python -m build

      - name: Verify metadata
        run: |
          pip install twine
          twine check dist/*

      - name: Install the built wheel in a clean environment
        # Catches a dependency declared in the dev group but imported at
        # runtime: the editable install used by other jobs would mask it.
        run: |
          python -m venv /tmp/verify
          /tmp/verify/bin/pip install dist/*.whl
          /tmp/verify/bin/marketpulse --version

      - uses: actions/upload-artifact@v7
        with:
          name: wheel
          path: dist/*

  ci-ok:
    # Single required status check for branch protection. Without this, adding
    # a matrix entry means editing the protection rule, and a job that is
    # skipped rather than passing can let a PR merge green.
    name: CI
    if: always()
    needs: [lint, types, test, coverage, architecture, build]
    runs-on: ubuntu-latest
    steps:
      - name: Verify every job succeeded
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "One or more jobs failed or were cancelled."
            exit 1
          fi
          echo "All jobs succeeded."
